version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: soc
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    networks:
      - internal

  backend:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "3001:3001"
    volumes:
      - screenshots:/app/screenshots
    networks:
      - internal
      - frontend
      - sandbox_net

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    security_opt:
      - seccomp:chrome-seccomp.json
    cap_drop:
      - ALL
    read_only: false        # Needs to write screenshots
    tmpfs:
      - /tmp
    volumes:
      - screenshots:/app/screenshots
    networks:
      - sandbox_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    networks:
      - frontend

networks:
  internal:
    driver: bridge
    internal: true          # only backend + DB + Redis
  frontend:
    driver: bridge          # frontend ↔ backend only
  sandbox_net:
    driver: bridge          # isolated from internal & frontend, can access internet
volumes:
  pgdata:
  screenshots:
